name: Build installers

# Builds Cue's distributable installers natively on each target OS — the only
# reliable way to get a Windows .exe (maker-squirrel needs real Windows; Wine on
# Apple Silicon is too flaky). Produces a GitHub Release you pull with the gh CLI
# (`gh release download <tag>`) — a CLI download sets no macOS quarantine xattr /
# no Windows mark-of-the-web, so the installers arrive clean (unlike a browser
# download). The macOS dmg is ad-hoc signed by forge.config.js's postPackage hook
# so it launches on Apple Silicon; the Windows exe is unsigned (Unblock-File on
# first run, or wire a self-signed cert into maker-squirrel later).

on:
  # Tag push is the primary trigger: it works even while this workflow lives only
  # on a feature branch (push events use the workflow file at the pushed ref), and
  # a tag is required for a Release anyway.
  push:
    tags:
      - 'v*'
  # Manual trigger — available once this file reaches the default branch.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish — match the app version, e.g. v19.2.3'
        required: true
        default: 'v19.2.3'

permissions:
  contents: write   # GITHUB_TOKEN needs this to create the Release

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # arm64 runner → Apple Silicon dmg
            label: macOS (dmg)
            artifact: cue-macos-dmg
            files: out/make/**/*.dmg
          - os: windows-latest     # x64 runner → Windows exe
            label: Windows (exe)
            artifact: cue-windows-exe
            files: out/make/**/*.exe
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the app build number is `git rev-list --count HEAD`
          # (vite.renderer.config.js). A shallow clone would pin every build to 1.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci installs the platform-matched grandi binary (@grandi/<os>-<arch>
      # with its libndi.*) as an optionalDependency; forge.config.js copies that
      # closure into the package. better-sqlite3 + grandi are rebuilt against
      # Electron's headers by forge's own rebuild step during `make` (the runners
      # ship the needed toolchain: MSVC+Python on Windows, Xcode CLT on macOS).
      - run: npm ci

      # YouTube-player binaries (yt-dlp + ffmpeg) are gitignored (~290 MB across
      # platforms), so fetch the current target's pair into resources/bin/<platform>-<arch>/
      # before packaging. forge.config.js extraResource ships the whole resources/bin
      # dir, so each installer carries only its own platform's binaries. yt-dlp_macos
      # is a universal binary; ffmpeg comes from the eugeneware/ffmpeg-static release.
      - name: Fetch yt-dlp + ffmpeg (macOS arm64)
        if: runner.os == 'macOS'
        run: |
          mkdir -p resources/bin/darwin-arm64
          curl -fL --retry 3 -o resources/bin/darwin-arm64/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos
          curl -fL --retry 3 -o resources/bin/darwin-arm64/ffmpeg https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-darwin-arm64
          chmod +x resources/bin/darwin-arm64/yt-dlp resources/bin/darwin-arm64/ffmpeg

      - name: Fetch yt-dlp + ffmpeg (Windows x64)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path resources/bin/win32-x64 | Out-Null
          Invoke-WebRequest -Uri https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile resources/bin/win32-x64/yt-dlp.exe
          Invoke-WebRequest -Uri https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-win32-x64 -OutFile resources/bin/win32-x64/ffmpeg.exe

      - run: npm run make

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist          # dist/<artifact-name>/<files>

      - name: Publish installers to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Cue ${{ github.event.inputs.tag || github.ref_name }}
          prerelease: true
          fail_on_unmatched_files: true
          files: dist/**/*
