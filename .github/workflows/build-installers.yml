name: Build installers

# Builds Cue's distributable installers natively on each target OS — the only
# reliable way to get a Windows .exe (the NSIS wizard + native rebuild need real
# Windows; Wine on Apple Silicon is too flaky). Produces a GitHub Release you pull with the gh CLI
# (`gh release download <tag>`) — a CLI download sets no macOS quarantine xattr /
# no Windows mark-of-the-web, so the installers arrive clean (unlike a browser
# download). The macOS dmg is ad-hoc signed by forge.config.js's postPackage hook
# so it launches on Apple Silicon; the Windows exe is unsigned (Unblock-File on
# first run, or wire a self-signed cert into maker-squirrel later).

on:
  # Tag push is the primary trigger: it works even while this workflow lives only
  # on a feature branch (push events use the workflow file at the pushed ref), and
  # a tag is required for a Release anyway.
  push:
    tags:
      - 'v*'
  # Manual trigger — available once this file reaches the default branch.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish — match the app version, e.g. v19.2.3'
        required: true
        default: 'v19.2.3'

permissions:
  contents: write   # GITHUB_TOKEN needs this to create the Release

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # arm64 runner → Apple Silicon dmg
            label: macOS (dmg)
            artifact: cue-macos-dmg
            files: out/make/**/*.dmg
          - os: windows-latest     # x64 runner → Windows exe
            label: Windows (exe)
            artifact: cue-windows-exe
            files: out/make/**/*.exe
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the app build number is `git rev-list --count HEAD`
          # (vite.renderer.config.js). A shallow clone would pin every build to 1.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          # Node 22 LTS: the Electron 42 toolchain (Forge 7.11 / @electron/rebuild 4)
          # requires Node >= 20.17; 22 is the current LTS and matches local dev (.nvmrc).
          node-version: 22
          cache: npm

      # npm ci installs the platform-matched grandi binary (@grandi/<os>-<arch>
      # with its libndi.*) as an optionalDependency; forge.config.js copies that
      # closure into the package. better-sqlite3 + grandi are rebuilt against
      # Electron's headers by forge's own rebuild step during `make` (the runners
      # ship the needed toolchain: MSVC+Python on Windows, Xcode CLT on macOS).
      - run: npm ci

      # The Windows installer is an NSIS wizard built by forge.config.js's postMake
      # hook (see there). makensis ships on the GitHub windows runner, but isn't
      # always on PATH — ensure it exists (choco fallback) and expose its dir.
      - name: Ensure NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) { choco install nsis -y }
          }
          Add-Content $env:GITHUB_PATH 'C:\Program Files (x86)\NSIS'

      # yt-dlp + ffmpeg are NOT bundled — the app auto-downloads them into userData on
      # first YouTube use (see src/main/youtube/bin.js), so there is nothing to fetch here.
      - run: npm run make

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist          # dist/<artifact-name>/<files>

      - name: Publish installers to a GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Cue ${{ github.event.inputs.tag || github.ref_name }}
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: dist/**/*
          body: |
            ## Install

            ### Windows
            The installer is not code-signed, so double-clicking `Cue-...Setup.exe` may trip SmartScreen. Easiest path — paste this into **PowerShell** to download the latest Setup and run it:

            ```powershell
            $u=(irm https://api.github.com/repos/will-eze/Cue/releases)[0].assets|?{$_.name -like '*Setup.exe'}|select -First 1 -Expand browser_download_url;$o="$env:TEMP\CueSetup.exe";iwr $u -OutFile $o;Start-Process $o
            ```

            This opens the Cue setup wizard: choose the install location, pick optional components (Desktop shortcut, launch-at-startup, and pre-downloading the media/scripture modules), and finish. Default install location is `%LOCALAPPDATA%\Programs\Cue` (per-user, no admin needed). The download to `%TEMP%` is only the installer — the app itself is installed permanently and survives a restart.

            ### macOS
            The build is ad-hoc signed (not notarized), so a **browser** download gets a quarantine flag that Gatekeeper hard-blocks ("Cue is damaged"). Download with the shell instead — paste this into **Terminal** to fetch, install to Applications, and launch:

            ```bash
            U=$(curl -s https://api.github.com/repos/will-eze/Cue/releases | grep -o 'https://[^"]*\.dmg' | head -1); curl -L "$U" -o /tmp/Cue.dmg && hdiutil attach /tmp/Cue.dmg -nobrowse -quiet && rm -rf /Applications/Cue.app && cp -R "/Volumes/Cue/Cue.app" /Applications/ && hdiutil detach "/Volumes/Cue" -quiet && xattr -dr com.apple.quarantine /Applications/Cue.app 2>/dev/null; open /Applications/Cue.app
            ```

            `curl` sets no quarantine flag, so Cue launches directly — no right-click → Open needed.
