<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cue Output</title>
  <link rel="stylesheet" href="../fonts/fonts.css" />
  <link rel="stylesheet" href="fullscreen.css" />
</head>
<body>
  <!-- #stage wraps the whole program layer (background + scrim + content) so the
       transition engine can clone/animate it as one unit. The #cue-gfx broadcast
       overlay stays OUTSIDE #stage — it's an independent bus, never transitioned. -->
  <div id="stage">
    <div id="background"></div>
    <!-- Theme treatment stack (directional scrim, vignette, grain, grade) — JS fills
         this with the resolved theme's overlay layers for legibility + look. -->
    <div id="scrim"></div>
    <div id="content">
      <div id="text-wrap">
        <div id="text"></div>
      </div>
      <!-- Presentation slide: a fixed 1920×1080 element canvas scaled to the viewport -->
      <div id="slide-elements"></div>
      <div id="logo-wrap"></div>
      <div id="copyright"></div>
    </div>
  </div>
  <script src="media-player.js"></script>
  <!-- Program-audio tap (NDI audio / streaming); no-op unless main enables it -->
  <script src="audio-tap.js"></script>
  <script src="transitions.js"></script>
  <script src="fullscreen.js"></script>
  <!-- Broadcast-graphics overlay (independent of the program slide) -->
  <script src="graphics-overlay.js"></script>
  <!-- Stream compositor (external feed + PiP/cut); no-op unless ?stream=1 -->
  <script src="stream-feed.js"></script>
</body>
</html>
