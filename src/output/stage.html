<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cue Stage Monitor</title>
  <link rel="stylesheet" href="../fonts/fonts.css" />
  <link rel="stylesheet" href="stage.css" />
</head>
<body>
  <!-- Customisable WYSIWYG stage display. stage.js builds one absolutely-positioned
       element per layout entry into #stage-root; the layout arrives via stage:layout
       (per channel). Until then the built-in default layout is rendered. -->
  <div id="stage-root"></div>
  <script src="media-player.js"></script>
  <script src="stage.js"></script>
</body>
</html>
