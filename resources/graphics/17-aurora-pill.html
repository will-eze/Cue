<!-- name: Aurora Pill -->
<style>
  .ap { position:absolute; left:90px; bottom:130px; padding:24px 52px; border-radius:999px; overflow:hidden;
    border:1px solid rgba(255,255,255,.2); box-shadow:0 18px 50px rgba(0,0,0,.4);
    opacity:0; transform:translateY(24px) scale(.97); }
  .ap::before { content:''; position:absolute; inset:-40%; z-index:-1; filter:blur(8px);
    background:
      radial-gradient(circle at 20% 30%,#00c6ff,transparent 40%),
      radial-gradient(circle at 80% 20%,#ff5edb,transparent 42%),
      radial-gradient(circle at 60% 90%,#43e97b,transparent 45%),
      #0a0e1a;
    animation: ap-flow 8s linear infinite; }
  .cue-in .ap  { animation: ap-in .6s cubic-bezier(.2,.9,.2,1) forwards; }
  .cue-out .ap { animation: ap-out .4s ease forwards; }
  .ap .n { font:700 52px/1 Inter,system-ui,sans-serif; color:#fff; text-shadow:0 2px 16px rgba(0,0,0,.5); }
  .ap .t { font:500 22px/1 'JetBrains Mono',ui-monospace,monospace; letter-spacing:.18em; text-transform:uppercase;
    color:rgba(255,255,255,.85); margin-top:8px; }
  .ap .t:empty { display:none; }
  @keyframes ap-in   { to { opacity:1; transform:translateY(0) scale(1); } }
  @keyframes ap-out  { to { opacity:0; transform:translateY(16px) scale(.98); } }
  @keyframes ap-flow { 0% { transform:rotate(0) scale(1.2); } 50% { transform:rotate(180deg) scale(1.5); } 100% { transform:rotate(360deg) scale(1.2); } }
</style>
<div class="ap">
  <div class="n">{{name}}</div>
  <div class="t">{{title}}</div>
</div>
