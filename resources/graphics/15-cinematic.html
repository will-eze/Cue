<!-- name: Cinematic -->
<style>
  .cn { position:absolute; left:0; right:0; bottom:170px; text-align:center; opacity:0; transform:translateY(20px); letter-spacing:.02em; }
  .cue-in .cn  { animation: cn-in 1s cubic-bezier(.2,.9,.2,1) forwards; }
  .cue-out .cn { animation: cn-out .5s ease forwards; }
  .cn .n { font:400 76px/1.05 'Cinzel','Cormorant Garamond',Georgia,serif; color:#f4ecd8; text-shadow:0 4px 30px rgba(0,0,0,.6); }
  .cn .rule { display:flex; align-items:center; justify-content:center; gap:18px; margin-top:20px; }
  .cn .rule i { height:1px; width:80px; background:rgba(212,180,120,.8); }
  .cn .rule span { font:500 20px/1 'JetBrains Mono',ui-monospace,monospace; letter-spacing:.42em; text-transform:uppercase; color:#d4b478; }
  @keyframes cn-in  { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
  @keyframes cn-out { to { opacity:0; transform:translateY(12px); } }
</style>
<div class="cn">
  <div class="n">{{name}}</div>
  <div class="rule"><i></i><span>{{title}}</span><i></i></div>
</div>
