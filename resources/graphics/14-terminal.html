<!-- name: Terminal -->
<style>
  .tm { position:absolute; left:90px; bottom:130px; min-width:520px; border-radius:12px; overflow:hidden;
    background:rgba(6,10,12,0.9); border:1px solid rgba(0,255,140,.25); box-shadow:0 18px 50px rgba(0,0,0,.5);
    font-family:'JetBrains Mono',ui-monospace,monospace; opacity:0; transform:translateY(24px); }
  .cue-in .tm  { animation: tm-in .45s ease forwards; }
  .cue-out .tm { animation: tm-out .35s ease forwards; }
  .tm .bar { display:flex; align-items:center; gap:8px; padding:12px 18px; background:rgba(255,255,255,.04); border-bottom:1px solid rgba(255,255,255,.06); }
  .tm .bar i { width:12px; height:12px; border-radius:50%; }
  .tm .bar i:nth-child(1) { background:#ff5f56; }
  .tm .bar i:nth-child(2) { background:#ffbd2e; }
  .tm .bar i:nth-child(3) { background:#27c93f; }
  .tm .body { padding:22px 28px 26px; }
  .tm .l1 { font:500 18px/1 inherit; color:#3df58a; letter-spacing:.04em; }
  .tm .l1::before { content:'$ '; color:#2a7a4f; }
  .tm .l1:empty { display:none; }
  .tm .n { font:700 46px/1.1 inherit; color:#eafff3; margin-top:14px; letter-spacing:.01em; }
  .tm .n::after { content:'_'; color:#3df58a; animation: tm-cur 1s steps(1) infinite; }
  .tm .t { font:400 20px/1 inherit; color:#6fae8a; margin-top:12px; }
  .tm .t:empty { display:none; }
  @keyframes tm-in  { to { opacity:1; transform:translateY(0); } }
  @keyframes tm-out { to { opacity:0; transform:translateY(16px); } }
  @keyframes tm-cur { 50% { opacity:0; } }
</style>
<div class="tm">
  <div class="bar"><i></i><i></i><i></i></div>
  <div class="body">
    <div class="l1">{{text}}</div>
    <div class="n">{{name}}</div>
    <div class="t">{{title}}</div>
  </div>
</div>
