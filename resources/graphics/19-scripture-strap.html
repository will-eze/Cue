<!-- name: Scripture Strap -->
<style>
  .ss { position:absolute; left:0; right:0; bottom:120px; display:flex; flex-direction:column; align-items:center; opacity:0; }
  .cue-in .ss  { animation: ss-in .7s ease forwards; }
  .cue-out .ss { animation: ss-out .45s ease forwards; }
  .ss .pill { display:inline-flex; align-items:center; gap:12px; padding:10px 26px; border-radius:999px;
    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.22);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); margin-bottom:18px; }
  .ss .pill i { width:7px; height:7px; border-radius:50%; background:#7cc0ff; }
  .ss .pill span { font:600 18px/1 'JetBrains Mono',ui-monospace,monospace; letter-spacing:.22em; text-transform:uppercase; color:#bcd6ff; }
  .ss .n { font:italic 400 52px/1.18 'Cormorant Garamond',Georgia,serif; text-align:center; max-width:1200px; color:#fff;
    text-shadow:0 3px 24px rgba(0,0,0,.55); }
  .ss .t { font:600 22px/1 'JetBrains Mono',ui-monospace,monospace; letter-spacing:.2em; text-transform:uppercase; color:#9bc4ff; margin-top:18px; }
  .ss .t:empty { display:none; }
  @keyframes ss-in  { from { opacity:0; transform:translateY(22px); } to { opacity:1; transform:translateY(0); } }
  @keyframes ss-out { to { opacity:0; transform:translateY(14px); } }
</style>
<div class="ss">
  <div class="pill"><i></i><span>{{text}}</span></div>
  <div class="n">{{name}}</div>
  <div class="t">{{title}}</div>
</div>
