<!-- name: Newsroom -->
<style>
  .nr { position:absolute; left:0; bottom:90px; display:flex; flex-direction:column; transform:translateY(120%); }
  .cue-in .nr  { animation: nr-in .5s cubic-bezier(.2,.8,.2,1) forwards; }
  .cue-out .nr { animation: nr-out .4s ease forwards; }
  .nr .top { display:flex; align-items:stretch; height:78px; }
  .nr .live { background:#e6122b; display:flex; align-items:center; gap:10px; padding:0 24px;
    font:800 22px/1 'JetBrains Mono',ui-monospace,monospace; letter-spacing:.18em; color:#fff; }
  .nr .live .b { width:10px; height:10px; border-radius:50%; background:#fff; animation: nr-blink 1.1s steps(1) infinite; }
  .nr .name { background:linear-gradient(90deg,#0b1f4d,#0a1631); display:flex; align-items:center; padding:0 44px; min-width:560px; }
  .nr .name .n { font:700 44px/1 Inter,system-ui,sans-serif; color:#fff; letter-spacing:.01em; }
  .nr .bottom { background:#0a0e18; padding:8px 44px; font:500 22px/1.2 Inter,system-ui,sans-serif; color:#9db8ff;
    letter-spacing:.02em; max-width:660px; }
  .nr .bottom:empty { display:none; }
  @keyframes nr-in    { to { transform:translateY(0); } }
  @keyframes nr-out   { to { transform:translateY(120%); } }
  @keyframes nr-blink { 50% { opacity:.25; } }
</style>
<div class="nr">
  <div class="top">
    <div class="live"><span class="b"></span>{{text}}</div>
    <div class="name"><span class="n">{{name}}</span></div>
  </div>
  <div class="bottom">{{title}}</div>
</div>
