<!-- name: Duotone Block -->
<style>
  .db { position:absolute; left:90px; bottom:130px; opacity:0; transform:translateX(-60px); }
  .cue-in .db  { animation: db-in .55s cubic-bezier(.2,.9,.25,1) forwards; }
  .cue-out .db { animation: db-out .35s ease forwards; }
  .db .shadow { position:absolute; left:16px; top:16px; right:-16px; bottom:-16px; background:#0a0e1a; }
  .db .card { position:relative; background:#ff5a2c; padding:24px 52px 28px; }
  .db .n { font:800 60px/1 'Oswald',Inter,sans-serif; text-transform:uppercase; letter-spacing:.01em; color:#0a0e1a; }
  .db .t { font:600 24px/1 'Oswald',Inter,sans-serif; letter-spacing:.18em; text-transform:uppercase; color:#0a0e1a; margin-top:10px; opacity:.78; }
  .db .t:empty { display:none; }
  @keyframes db-in  { to { opacity:1; transform:translateX(0); } }
  @keyframes db-out { to { opacity:0; transform:translateX(-40px); } }
</style>
<div class="db">
  <div class="shadow"></div>
  <div class="card">
    <div class="n">{{name}}</div>
    <div class="t">{{title}}</div>
  </div>
</div>
