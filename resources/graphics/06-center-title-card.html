<!-- name: Center Title Card -->
<style>
  .ct { position:absolute; left:0; right:0; bottom:160px; text-align:center; opacity:0; }
  .cue-in .ct  { animation: ct-in .7s cubic-bezier(.2,.9,.2,1) forwards; }
  .cue-out .ct { animation: ct-out .4s ease forwards; }
  .ct .lines { display:flex; align-items:center; justify-content:center; gap:24px; margin-bottom:18px; }
  .ct .lines i { display:block; height:1px; width:120px; background:linear-gradient(90deg,transparent,#e8c074); }
  .ct .lines i:last-child { background:linear-gradient(90deg,#e8c074,transparent); }
  .ct .k { font:600 20px/1 'JetBrains Mono',ui-monospace,monospace; letter-spacing:.4em; text-transform:uppercase; color:#e8c074; }
  .ct .n { font:700 72px/1.04 'Cormorant Garamond',Georgia,serif; color:#fff; text-shadow:0 4px 30px rgba(0,0,0,.55); margin-top:6px; }
  .ct .t { font:400 26px/1.3 Inter,system-ui,sans-serif; letter-spacing:.04em; color:rgba(255,255,255,.7); margin-top:14px; }
  .ct .k:empty, .ct .t:empty { display:none; }
  @keyframes ct-in  { from { opacity:0; transform:translateY(26px); } to { opacity:1; transform:translateY(0); } }
  @keyframes ct-out { to { opacity:0; transform:translateY(16px); } }
</style>
<div class="ct">
  <div class="lines"><i></i><span class="k">{{text}}</span><i></i></div>
  <div class="n">{{name}}</div>
  <div class="t">{{title}}</div>
</div>
