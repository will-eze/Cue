<!-- name: Frosted Glass -->
<style>
  .gp { position:absolute; left:80px; bottom:120px; min-width:520px; padding:26px 44px;
    border-radius:18px; background:rgba(20,24,33,0.38);
    backdrop-filter:blur(22px) saturate(140%); -webkit-backdrop-filter:blur(22px) saturate(140%);
    border:1px solid rgba(255,255,255,0.18);
    box-shadow:0 20px 60px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.25);
    opacity:0; transform:translateY(40px) scale(.98); }
  .cue-in .gp  { animation: gp-in .7s cubic-bezier(.2,.9,.2,1) forwards; }
  .cue-out .gp { animation: gp-out .4s ease forwards; }
  .gp .k { font:600 18px/1 'JetBrains Mono',ui-monospace,monospace; letter-spacing:.32em; text-transform:uppercase; color:#5fd0ff; margin-bottom:12px; }
  .gp .n { font:700 56px/1.05 Inter,system-ui,sans-serif; color:#fff; text-shadow:0 2px 18px rgba(0,0,0,.4); }
  .gp .t { font:500 26px/1.2 Inter,system-ui,sans-serif; color:rgba(255,255,255,.72); margin-top:8px; }
  .gp .k:empty, .gp .t:empty { display:none; }
  @keyframes gp-in  { to { opacity:1; transform:translateY(0) scale(1); } }
  @keyframes gp-out { to { opacity:0; transform:translateY(24px) scale(.98); } }
</style>
<div class="gp">
  <div class="k">{{text}}</div>
  <div class="n">{{name}}</div>
  <div class="t">{{title}}</div>
</div>
